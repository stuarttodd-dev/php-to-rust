[package]
name = "shop-front"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "shop-front"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1"
discounts = { path = "../../ch12-building-an-api/discounts" }
gloo-net = "0.7"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
shop = { path = "../../ch12-building-an-api/shop" }
wasm-bindgen = "0.2"
