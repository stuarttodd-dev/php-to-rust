name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://shop:shop@localhost:5432/shop

jobs:
  crates:
    name: crates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Forbid root Cargo.toml
        run: |
          if [ -f Cargo.toml ]; then
            echo "::error::Root Cargo.toml must not exist (nested crates treat it as a broken workspace)."
            exit 1
          fi
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Migrate shop-api
        working-directory: ch12-building-an-api/shop-api
        run: sqlx migrate run
      - name: shop-api starter compiles, then apply solution
        run: |
          cargo test --no-run --manifest-path ch12-building-an-api/shop-api/Cargo.toml
          cp ch12-building-an-api/shop-api/solution/*.rs ch12-building-an-api/shop-api/src/
      - name: fmt (ch12 workspace)
        working-directory: ch12-building-an-api
        run: cargo fmt --all -- --check
      - name: clippy + test ch12 workspace
        working-directory: ch12-building-an-api
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Discover and test chapter crates
        run: bash scripts/ci-test-crates.sh

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Forbid root Cargo.toml
        run: |
          if [ -f Cargo.toml ]; then
            echo "::error::Root Cargo.toml must not exist (nested crates treat it as a broken workspace)."
            exit 1
          fi
      - name: Build shop-pricing for wasm
        run: cargo build --manifest-path ch13-wasm/shop-pricing/Cargo.toml --target wasm32-unknown-unknown
      - name: shop-front starter + solution for wasm
        run: |
          cargo build --manifest-path ch13-wasm/shop-front/Cargo.toml --target wasm32-unknown-unknown
          cp ch13-wasm/shop-front/solution/*.rs ch13-wasm/shop-front/src/
          cargo build --manifest-path ch13-wasm/shop-front/Cargo.toml --target wasm32-unknown-unknown
      - name: Native unit tests (shop-pricing)
        run: cargo test --manifest-path ch13-wasm/shop-pricing/Cargo.toml
